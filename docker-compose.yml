x-db-env: &db-env
  SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:postgresql://postgres:5432/paoliciassweet}
  SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-postgres}
  SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-paolicias_local}

services:
  postgres:
    image: postgres:16-alpine
    container_name: paolicias-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: paoliciassweet
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: paolicias_local
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  catalogo-service:
    build: ./catalogo-service
    container_name: catalogo-service
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      <<: *db-env
      PORT: "8081"
    depends_on:
      - postgres

  reservas-service:
    build: ./reservas-service
    container_name: reservas-service
    restart: unless-stopped
    ports:
      - "8082:8082"
    environment:
      <<: *db-env
      PORT: "8082"
    depends_on:
      - postgres

  comprobantes-service:
    build: ./comprobantes-service
    container_name: comprobantes-service
    restart: unless-stopped
    ports:
      - "8083:8083"
    environment:
      <<: *db-env
      PORT: "8083"
    depends_on:
      - postgres

volumes:
  postgres_data:
